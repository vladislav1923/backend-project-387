name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      contains(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          # Needed so later git push can use GITHUB_TOKEN (use_github_token: true).
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify CURSOR_API_KEY secret
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          if [ -z "${CURSOR_API_KEY}" ]; then
            echo "::error::CURSOR_API_KEY is empty. Add it under Settings → Secrets and variables → Actions (repository secret, exact name CURSOR_API_KEY)."
            exit 1
          fi
          echo "CURSOR_API_KEY is set (length=${#CURSOR_API_KEY})."

      # Required when use_github_token is true — GITHUB_TOKEN commits/pushes need identity + remote auth.
      - name: Configure git for push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: cursor/composer-2.5
          use_github_token: true
